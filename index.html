<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>生体認証テスト</title>
</head>
<body>
  <h1>Face ID / Touch ID 認証</h1>
  <button id="authBtn">認証する</button>

  <script>
    document.getElementById('authBtn').addEventListener('click', async () => {
      if (!window.PublicKeyCredential) {
        alert("このブラウザはWebAuthnに対応していません");
        return;
      }

      try {
        const cred = await navigator.credentials.get({
          publicKey: {
            challenge: new Uint8Array(32), // 本来はサーバーから送る値
            allowCredentials: [],
            timeout: 60000,
            userVerification: "required"
          }
        });
        alert("認証成功！");
      } catch (err) {
        alert("認証失敗: " + err);
      }
    });
  </script>
</body>
</html>
