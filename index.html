<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID 認証デモ</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #ffe6f0;
      transition: background 0.5s;
    }
    button {
      margin: 10px;
      padding: 1em 2em;
      font-size: 1.1em;
      border: none;
      border-radius: 6px;
      background: #ff69b4;
      color: white;
    }
    #status { margin-top: 1em; }
  </style>
</head>
<body>
  <h1>Face ID 認証デモ</h1>
  <button id="registerBtn">🔐 登録する（初回）</button>
  <button id="authBtn">✅ 認証する</button>
  <div id="status"></div>

  <script>
    function randomChallenge() {
      const c = new Uint8Array(32);
      crypto.getRandomValues(c);
      return c;
    }

    // 登録（create）
    document.getElementById('registerBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = "登録中...";

      try {
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: randomChallenge(),
            rp: { name: "My Test Site", id: window.location.hostname },
            user: {
              id: new Uint8Array([1,2,3,4]),
              name: "user@example.com",
              displayName: "User"
            },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }],
            authenticatorSelection: {
              authenticatorAttachment: "platform", // 内蔵Face/Touch IDを強制
              userVerification: "required"
            },
            timeout: 60000,
            attestation: "none"
          }
        });

        status.textContent = "✅ 登録完了！";
      } catch (err) {
        status.textContent = "登録失敗: " + err;
      }
    });

    // 認証（get）
    document.getElementById('authBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = "認証中...";

      try {
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: randomChallenge(),
            timeout: 60000,
            userVerification: "required",
            authenticatorSelection: { authenticatorAttachment: "platform" }
          }
        });
        document.body.style.background = "#ffb6c1";
        status.textContent = "🎉 認証成功（Face IDで完了）";
      } catch (err) {
        status.textContent = "認証失敗: " + err;
      }
    });
  </script>
</body>
</html>
