<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIN認証</title>
<style>
  body {
    background-color: #ffe6f0;
    font-family: "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container { text-align: center; }
  input {
    font-size: 1.2rem;
    padding: 10px;
    border: none;
    border-radius: 10px;
    width: 120px;
    text-align: center;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background-color: #ff99c8;
    color: white;
    font-weight: bold;
  }
  .msg { margin-top: 10px; color: #e91e63; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <h2>パスコードを入力</h2>
    <input id="pin" type="password" maxlength="4" inputmode="numeric" />
    <br />
    <button id="checkBtn">送信</button>
    <div class="msg" id="msg"></div>
  </div>

<script>
  const storedHash = "f48e2b7ef3c418ca6ac3b7b4b3d1ce5d62f2e5f8b66f511a29e984bf4166f35e"; // ← 0121 のSHA-256
  const msg = document.getElementById("msg");

  async function sha256(text) {
    const buffer = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", buffer);
    return Array.from(new Uint8Array(hash))
      .map(b => b.toString(16).padStart(2, '0')).join('');
  }

  document.getElementById("checkBtn").addEventListener("click", async () => {
    const pin = document.getElementById("pin").value;
    const enteredHash = await sha256(pin);

    if (enteredHash === storedHash) {
      msg.style.color = "green";
      msg.textContent = "認証成功！";
      setTimeout(() => location.href = "success.html", 500);
    } else {
      msg.style.color = "#e91e63";
      msg.textContent = "パスコードが違います。";
    }
  });
</script>
</body>
</html>
