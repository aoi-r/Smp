<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID 認証デモ</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fff0f6; /* 初期は淡いピンク */
      transition: background-color 0.5s ease;
      font-family: sans-serif;
    }
    button {
      background: #ff69b4;
      color: white;
      border: none;
      padding: 1em 2em;
      font-size: 1.2em;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #ff85c1;
    }
    #status {
      margin-top: 2em;
      font-size: 1.1em;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>Face ID / Touch ID 認証</h1>
  <button id="authBtn">認証する</button>
  <div id="status"></div>

  <script>
    document.getElementById('authBtn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = "認証中...";
      if (!window.PublicKeyCredential) {
        status.textContent = "このブラウザはWebAuthnに対応していません。";
        return;
      }

      // ランダムチャレンジ（本来はサーバーが生成）
      const challenge = new Uint8Array(32);
      window.crypto.getRandomValues(challenge);

      try {
        const credential = await navigator.credentials.get({
          publicKey: {
            challenge: challenge,
            userVerification: "required",
            authenticatorSelection: {
              authenticatorAttachment: "platform" // ← 内蔵Face/Touch IDを指定
            },
            timeout: 60000
          }
        });

        // 認証成功
        status.textContent = "✅ 認証成功！コミット完了しました。";
        document.body.style.backgroundColor = "#ffb6c1"; // 濃いピンクに変化
      } catch (err) {
        status.textContent = "❌ 認証失敗: " + err;
      }
    });
  </script>
</body>
</html>
