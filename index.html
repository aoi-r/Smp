<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PIN認証</title>
<style>
  body {
    background-color: #ffe6f0;
    font-family: "Helvetica Neue", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    text-align: center;
  }

  h2 {
    margin-bottom: 20px;
    color: #333;
  }

  .pin-inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  input[type="password"] {
    width: 50px;
    height: 50px;
    font-size: 24px;
    text-align: center;
    border: none;
    border-radius: 10px;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  input[type="password"]:focus {
    outline: 2px solid #ff99c8;
  }

  .message {
    margin-top: 15px;
    color: #e91e63;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>パスコードを入力</h2>
    <div class="pin-inputs">
      <input type="password" maxlength="1" inputmode="numeric" />
      <input type="password" maxlength="1" inputmode="numeric" />
      <input type="password" maxlength="1" inputmode="numeric" />
      <input type="password" maxlength="1" inputmode="numeric" />
    </div>
    <div class="message" id="msg"></div>
  </div>

  <script>
    const inputs = document.querySelectorAll('.pin-inputs input');
    const message = document.getElementById('msg');
    const correctPin = "0121";

    inputs.forEach((input, index) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkPin();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    function checkPin() {
      const enteredPin = Array.from(inputs).map(i => i.value).join('');
      if (enteredPin.length === 4) {
        if (enteredPin === correctPin) {
          message.textContent = "認証成功！";
          message.style.color = "green";
          setTimeout(() => {
            window.location.href = "success.html"; // ← 遷移先
          }, 500);
        } else {
          message.textContent = "パスコードが違います";
          message.style.color = "#e91e63";
          inputs.forEach(i => i.value = '');
          inputs[0].focus();
        }
      }
    }

    // 初期フォーカス
    inputs[0].focus();
  </script>
</body>
</html>
